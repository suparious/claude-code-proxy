[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-proxy"
version = "2.2.0"
description = "Anthropic-compatible Claude Code proxy with provider routing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.3",
    "httpx[socks]>=0.28.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.7.0",
    "pydantic-settings>=2.15.0",
    "openai>=2.34.0",
    "loguru>=0.7.0",
    # Security floors for transitive deps pulled by fastapi[standard].
    # Pinning here (rather than relying on transitive resolution) ensures
    # patched versions are always selected and makes the requirement explicit.
    "starlette>=1.6.0",
    "aiohttp>=3.14.3",
    "python-multipart>=0.0.31",
]

[project.urls]
Homepage = "https://github.com/suparious/claude-code-proxy"
Repository = "https://github.com/suparious/claude-code-proxy"
Issues = "https://github.com/suparious/claude-code-proxy/issues"
Changelog = "https://github.com/suparious/claude-code-proxy/blob/main/CHANGELOG.md"
CI = "https://github.com/suparious/claude-code-proxy/actions/workflows/tests.yml"

[project.scripts]
claude-code-proxy = "cli.entrypoints:serve"
ccp-init = "cli.entrypoints:init"
free-claude-code = "cli.entrypoints:serve"
fcc-init = "cli.entrypoints:init"

[tool.hatch.build.targets.wheel]
packages = ["api", "cli", "config", "core", "providers"]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "cli/env.example"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.72",
    "ruff>=0.16.3",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernise syntax for target Python version)
    "B",    # flake8-bugbear (common bugs and anti-patterns)
    "C4",   # flake8-comprehensions (idiomatic comprehensions)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "PERF", # Perflint (performance anti-patterns)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long — enforced by the formatter instead
    "B008",  # FastAPI Depends() in argument defaults is intentional
    "RUF006",  # fire-and-forget tasks intentionally not awaited
]

[tool.ruff.lint.isort]
known-first-party = ["api", "cli", "config", "core", "providers", "smoke"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-n auto"
testpaths = ["tests"]
markers = [
    "live: opt-in local smoke tests that can touch real services",
    "interactive: smoke tests requiring manual user interaction",
    "provider: live provider checks",
    "cli: CLI integration checks",
    "clients: client compatibility checks",
    "contract: deterministic feature contract checks",
    "smoke_target(name): route a smoke test behind FCC_SMOKE_TARGETS",
]

[tool.ty.environment]
python-version = "3.14"
